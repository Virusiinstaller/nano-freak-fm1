# SPDX-License-Identifier: GPL-3.0-only
# FMini-1: builds the firmware (FM-1 and the SMK-37's three models) and publishes the web installer
# (web/make_fmini_installer.py: one page with the four packages inside) on GitHub Pages, at https://virusiinstaller.github.io/nano-freak-fm1/.
# Once in the repository's Settings > Pages: Source = GitHub Actions.
name: Installer

on:
  push:
    branches: [main]
    paths: ["firmware/**", "web/**", "tools/**", "assets/**", "build.sh", "docs/emu/**", ".github/workflows/installer.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install Pillow fonttools

      - name: JieLi toolchain and AC79 SDK
        run: |
          tools/get_toolchain.sh
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"

      - name: Build the firmware (the SMK-37's three models, then the FM-1)
        run: |
          BOARD=smk37 ./build.sh
          BOARD=smk37 MODEL=elite ./build.sh
          BOARD=smk37 MODEL=mke ./build.sh
          ./build.sh

      - name: Make the installer page
        run: |
          VERSION=$(sed -n 's/^#define FMINI_VERSION "v\(.*\)"/\1/p' firmware/src/core.h)
          mkdir -p _site
          python3 web/make_fmini_installer.py "build/nano-freak-fm1-$VERSION.fwsc" _site/index.html "$VERSION"
          cp "build/nano-freak-fm1-$VERSION.fwsc" "_site/nano-freak-$VERSION.fwsc"
          cp "build/nano-freak-fm1-$VERSION.fwsc" build/nano-freak-smk37*-"$VERSION".fwsc _site/
          # Not published for now (they are the FMini-1 ones, not the Nano Freak's): the web editor (web/editor_fmini.html -> _site/editor/index.html)
          # and the browser emulators (docs/emu -> _site/emu, SMK-37 in docs/emu/smk; web/emu/build_wasi.sh, SMK=1). Put the two copies back when they are rebuilt.
          echo "Nano Freak (FMini-1 base) v$VERSION (FM-1 and SMK-37)" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the .fwsc packages as a plain download
        uses: actions/upload-artifact@v4
        with:
          name: fwsc-packages
          path: build/*.fwsc

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
